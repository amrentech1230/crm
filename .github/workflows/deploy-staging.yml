name: Deploy to Staging

# Auto-deploys the devN branch to the Staging environment on every push
# (i.e. whenever a PR is merged into devN). Can also be run manually.
on:
  push:
    branches: [devN]
  workflow_dispatch:

permissions:
  contents: read

# Never run two staging deploys at once; queue them instead of cancelling
# so a running deploy always finishes cleanly.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy devN -> Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - name: SSH preflight check and debug
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: devN
        run: |
          echo "==> Preflight: validate SSH connectivity to $SSH_HOST:$SSH_PORT"
          echo "==> System diagnostic info:"
          echo "GitHub Runner OS: $(uname -a)"
          echo "Checking if SSH_HOST and SSH_PORT are set..."
          
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ]; then
            echo "::error::SSH_HOST or SSH_PORT secrets are not configured. Please set them in Settings > Secrets and variables > Actions"
            exit 1
          fi
          
          echo "SSH_HOST is set (length: ${#SSH_HOST})"
          echo "SSH_PORT is set (length: ${#SSH_PORT})"
          
          # Try DNS resolution first
          echo "==> Attempting DNS resolution for $SSH_HOST"
          if timeout 5 nslookup "$SSH_HOST" >/dev/null 2>&1; then
            echo "OK: DNS resolution successful"
            RESOLVED_IP=$(timeout 5 nslookup "$SSH_HOST" 2>/dev/null | grep -A1 "Name:" | grep "Address:" | tail -1 | awk '{print $NF}')
            echo "Resolved IP: $RESOLVED_IP"
          else
            echo "WARN: DNS resolution failed or took too long. Continuing with direct IP attempt..."
          fi
          
          # Try connecting up to 3 times with longer initial timeout
          for i in 1 2 3; do
            echo ""
            echo "Attempt $i/3: testing TCP connect to $SSH_HOST:$SSH_PORT (timeout: 10 seconds)"
            if timeout 10 bash -c "cat < /dev/tcp/$SSH_HOST/$SSH_PORT" >/dev/null 2>&1; then
              echo "✓ OK: TCP port $SSH_PORT on $SSH_HOST is reachable"
              break
            else
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 124 ]; then
                echo "✗ TIMEOUT: Connection attempt timed out (likely firewall or network issue)"
              else
                echo "✗ FAILED: Connection refused or host unreachable (exit code: $EXIT_CODE)"
              fi
              
              if [ $i -lt 3 ]; then
                echo "  Waiting 6 seconds before retry..."
                sleep 6
              fi
            fi
          done
          
          # Final check with extended timeout
          echo ""
          echo "==> Final connectivity check..."
          if timeout 5 bash -c "cat < /dev/tcp/$SSH_HOST/$SSH_PORT" >/dev/null 2>&1; then
            echo "✓ SUCCESS: SSH host is reachable. Proceeding with deploy."
          else
            echo "::error::SSH host $SSH_HOST:$SSH_PORT unreachable after 3 retries."
            echo "::error::Troubleshooting:"
            echo "::error::1. Verify SSH_HOST and SSH_PORT secrets are correctly set"
            echo "::error::2. Confirm the staging server is running and SSH is listening"
            echo "::error::3. Check firewall/security group rules allow GitHub Actions IPs"
            echo "::error::4. If using hostname, verify DNS resolution is working"
            exit 1
          fi
          
          # Debug output (non-sensitive)
          echo ""
          echo "DEPLOY_PATH=${DEPLOY_PATH:-(unset)}"
          echo "DEPLOY_BRANCH=${DEPLOY_BRANCH:-(unset)}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: devN
          PHP_BIN: ${{ vars.PHP_BIN }}
          COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,DEPLOY_BRANCH,PHP_BIN,COMPOSER_BIN
          script_stop: true
          # Shorter command-level timeout; preflight ensures reachability so the
          # action will fail faster if the host drops during the deploy.
          timeout: 120
          script: |
            set -euo pipefail

            # Allow overriding the php/composer binaries per environment
            # (e.g. PHP_BIN=php8.2 on some Hostinger setups). Defaults are fine
            # when `php` and `composer` are already on the deploy user's PATH.
            PHP_BIN="${PHP_BIN:-php}"
            COMPOSER_BIN="${COMPOSER_BIN:-composer}"

            echo "==> Deploying $DEPLOY_BRANCH to $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "==> Fetching latest code"
            git fetch --all --prune
            git reset --hard "origin/$DEPLOY_BRANCH"

            # The site user's umask is restrictive (files land as 660/dirs 770),
            # but nginx serves static assets as another user and needs to read
            # them. Make the web root readable/traversable by all, or every
            # deploy 404s the CSS/JS/images.
            echo "==> Ensuring web-root files are readable by nginx"
            chmod -R a+rX public

            echo "==> Installing PHP dependencies (production)"
            $COMPOSER_BIN install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "==> Enabling maintenance mode"
            $PHP_BIN artisan down --retry=15 || true
            # Ensure the app is brought back up even if a later step fails.
            trap '$PHP_BIN artisan up || true' EXIT

            echo "==> Running database migrations"
            $PHP_BIN artisan migrate --force

            echo "==> Rebuilding caches (route:cache skipped — see note)"
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan event:cache
            $PHP_BIN artisan view:cache
            # NOTE: 'php artisan route:cache' is intentionally NOT run — routes/web.php
            # currently has duplicate route names, which make route caching fail.
            # Switch this block back to a single 'php artisan optimize' once the
            # duplicate route names are cleaned up.
            $PHP_BIN artisan storage:link || true

            echo "==> Restarting queue workers (Supervisor picks up new code)"
            $PHP_BIN artisan queue:restart

            echo "==> Disabling maintenance mode"
            $PHP_BIN artisan up
            trap - EXIT

            echo "==> Staging deploy complete"
