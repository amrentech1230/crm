name: Deploy to Staging

# Deploys the devN branch to Staging on every push.
#
# This job runs on a SELF-HOSTED runner installed on the production/staging
# VPS. Because the runner executes ON the server, no inbound SSH is required
# (no port 2222, no firewall dependency). The deploy commands run locally.
on:
  push:
    branches: [devN]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy devN -> Staging
    runs-on: [self-hosted]

    environment:
      name: staging
      url: https://stagingcci.in

    env:
      DEPLOY_PATH: ${{ secrets.STAGING_PATH || vars.DEPLOY_PATH }}
      WEB_ROOT: ${{ vars.WEB_ROOT || format('{0}/public', secrets.STAGING_PATH || vars.DEPLOY_PATH) }}
      DEPLOY_BRANCH: devN
      PHP_BIN: ${{ vars.PHP_BIN }}
      COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}

    steps:
      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          echo "==> Validating staging deploy configuration"
          echo "DEPLOY_PATH=${DEPLOY_PATH:-<unset>}"
          echo "WEB_ROOT=${WEB_ROOT:-<unset>}"
          echo "DEPLOY_BRANCH=${DEPLOY_BRANCH:-<unset>}"

          if [[ -z "${DEPLOY_PATH}" ]]; then
            echo "::error::Missing DEPLOY_PATH. Configure it in the staging environment variables."
            exit 1
          fi
          if [[ ! -d "${DEPLOY_PATH}" ]]; then
            echo "Creating deployment directory..."
            mkdir -p "$DEPLOY_PATH"
          fi

      - name: Deploy locally
        run: |
          set -euo pipefail

          PHP_BIN="${PHP_BIN:-php}"
          COMPOSER_BIN="${COMPOSER_BIN:-composer}"

          echo "=========================================="
          echo "==> Starting Staging Deployment"
          echo "=========================================="

          echo "==> Deploy branch: $DEPLOY_BRANCH"
          echo "==> Deploy path: $DEPLOY_PATH"

          echo "==> Changing to application directory"
          cd "$DEPLOY_PATH"

          echo "==> Ensuring directory is a git repository"
          if [[ ! -d .git ]]; then
            echo "==> No .git found — initializing repository"
            git init
            if ! git remote | grep -q '^origin$'; then
              git remote add origin "https://github.com/amrentech1230/crm.git"
            fi
          fi

          echo "==> Fetching latest code"
          git fetch --all --prune

          echo "==> Resetting to origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          echo "==> Deployed commit: $(git rev-parse HEAD)"
          if [[ ! -f "${WEB_ROOT}/index.php" ]]; then
            echo "::error::WEB_ROOT does not contain public/index.php: ${WEB_ROOT}"
            exit 1
          fi
          printf '%s\n' "$(git rev-parse HEAD)" > "${WEB_ROOT}/deploy-sha.txt"

          echo "==> Installing PHP dependencies"
          $COMPOSER_BIN install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev

          echo "==> Enabling maintenance mode"
          $PHP_BIN artisan down --retry=15 || true

          trap '$PHP_BIN artisan up || true' EXIT

          echo "==> Running database migrations"
          $PHP_BIN artisan migrate --force

          echo "==> Clearing Laravel caches"
          $PHP_BIN artisan optimize:clear

          echo "==> Caching configuration"
          $PHP_BIN artisan config:cache

          echo "==> Caching events"
          $PHP_BIN artisan event:cache

          echo "==> Caching views"
          $PHP_BIN artisan view:cache

          echo "==> Creating storage link"
          # 'php artisan storage:link' uses exec() which is disabled on this
          # host, so create the symlink directly. Non-fatal if it already exists.
          if [[ ! -e public/storage ]]; then
            ln -s ../storage/app/public public/storage || true
          fi

          echo "==> Restarting queue workers"
          $PHP_BIN artisan queue:restart

          echo "==> Disabling maintenance mode"
          $PHP_BIN artisan up

          trap - EXIT

          echo "=========================================="
          echo "==> Staging deployment completed"
          echo "=========================================="
