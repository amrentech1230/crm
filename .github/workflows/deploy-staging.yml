name: Deploy to Staging

# Auto-deploys the devN branch to the Staging environment on every push
# (i.e. whenever a PR is merged into devN). Can also be run manually.
on:
  push:
    branches: [devN]
  workflow_dispatch:

permissions:
  contents: read

# Never run two staging deploys at once; queue them instead of cancelling
# so a running deploy always finishes cleanly.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy devN -> Staging
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: ${{ vars.DEPLOY_URL }}

    steps:
      # ============================================================
      # SSH PREFLIGHT
      # ============================================================
      - name: SSH preflight check and debug
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: devN
        run: |
          echo "==> Preflight: validating SSH TCP connectivity"

          CONNECTED=false

          for i in 1 2 3; do
            echo "Attempt $i: testing TCP connection to SSH port"

            if timeout 8 bash -c 'exec 3<>/dev/tcp/$1/$2; exec 3>&-; exec 3<&-' _ "$SSH_HOST" "$SSH_PORT"; then
              echo "OK: TCP port $SSH_PORT on SSH host is reachable"
              CONNECTED=true
              break
            else
              echo "WARN: attempt $i failed — host not reachable yet"
              sleep 4
            fi
          done

          if [ "$CONNECTED" != "true" ]; then
            echo "::error::SSH host unreachable after retries. Aborting deploy step."
            exit 1
          fi

          echo "DEPLOY_PATH=${DEPLOY_PATH:-(unset)}"
          echo "DEPLOY_BRANCH=${DEPLOY_BRANCH:-(unset)}"

      # ============================================================
      # DEPLOY OVER SSH
      # ============================================================
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: devN
          PHP_BIN: ${{ vars.PHP_BIN }}
          COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,DEPLOY_BRANCH,PHP_BIN,COMPOSER_BIN
          script_stop: true
          timeout: 2m

          script: |
            set -euo pipefail

            # Allow overriding PHP/Composer binaries per environment.
            PHP_BIN="${PHP_BIN:-php}"
            COMPOSER_BIN="${COMPOSER_BIN:-composer}"

            echo "==> Deploying $DEPLOY_BRANCH to $DEPLOY_PATH"

            cd "$DEPLOY_PATH"

            echo "==> Fetching latest code"
            git fetch --all --prune

            echo "==> Resetting to origin/$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            # The site user's umask can create restrictive permissions.
            # Ensure nginx can read public assets.
            echo "==> Ensuring web-root files are readable by nginx"
            chmod -R a+rX public

            echo "==> Installing PHP dependencies (production)"
            $COMPOSER_BIN install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-dev

            echo "==> Enabling maintenance mode"
            $PHP_BIN artisan down --retry=15 || true

            # Ensure application comes back up if any later step fails.
            trap '$PHP_BIN artisan up || true' EXIT

            echo "==> Running database migrations"
            $PHP_BIN artisan migrate --force

            echo "==> Rebuilding application caches"
            $PHP_BIN artisan optimize:clear

            echo "==> Caching configuration"
            $PHP_BIN artisan config:cache

            echo "==> Caching events"
            $PHP_BIN artisan event:cache

            echo "==> Caching views"
            $PHP_BIN artisan view:cache

            # Route cache intentionally skipped because routes/web.php
            # currently contains duplicate route names.
            echo "==> Creating storage link"
            $PHP_BIN artisan storage:link || true

            echo "==> Restarting queue workers"
            $PHP_BIN artisan queue:restart

            echo "==> Disabling maintenance mode"
            $PHP_BIN artisan up

            trap - EXIT

            echo "==> Staging deploy complete"