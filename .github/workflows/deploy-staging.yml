name: Deploy to Staging

# Deploys the devN branch to Staging on every push.
#
# This job connects to the staging server using the configured SSH secrets.
on:
  push:
    branches: [devN]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy devN -> Staging
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: https://stagingcci.in

    env:
      DEPLOY_PATH: ${{ secrets.STAGING_PATH || vars.DEPLOY_PATH }}
      WEB_ROOT: ${{ vars.WEB_ROOT || format('{0}/public', secrets.STAGING_PATH || vars.DEPLOY_PATH) }}
      DEPLOY_BRANCH: devN
      PHP_BIN: ${{ vars.PHP_BIN }}
      COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || secrets.STAGING_USERNAME }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,WEB_ROOT,DEPLOY_BRANCH,PHP_BIN,COMPOSER_BIN
          script: |
            set -euo pipefail

            PHP_BIN="${PHP_BIN:-php}"
            COMPOSER_BIN="${COMPOSER_BIN:-composer}"
            DEPLOY_PATH="${DEPLOY_PATH:-/home/u698476407/domains/stagingcci.in/crm_app}"
            WEB_ROOT="${WEB_ROOT:-${DEPLOY_PATH}/public}"
            DEPLOY_BRANCH="${DEPLOY_BRANCH:-devN}"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [[ ! -d .git ]]; then
              git init
              git remote add origin "https://github.com/amrentech1230/crm.git"
            fi

            git fetch --all --prune
            git reset --hard "origin/$DEPLOY_BRANCH"
            echo "Deployed commit: $(git rev-parse HEAD)"

            $COMPOSER_BIN install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            $PHP_BIN artisan down --retry=15 || true
            trap '$PHP_BIN artisan up || true' EXIT
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan event:cache
            $PHP_BIN artisan view:cache

            if [[ ! -f "${WEB_ROOT}/index.php" ]]; then
              echo "WEB_ROOT does not contain public/index.php: ${WEB_ROOT}"
              exit 1
            fi

            printf '%s\n' "$(git rev-parse HEAD)" > "${WEB_ROOT}/deploy-sha.txt"
            $PHP_BIN artisan up
            trap - EXIT
