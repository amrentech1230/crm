name: Deploy to Production

# Deploys the main branch to Production on every push (i.e. when devN is
# merged into main). The `production` GitHub Environment should have
# "Required reviewers" enabled so this run pauses for manual approval
# before the deploy step executes. See DEPLOYMENT.md.
#
# This job runs on a SELF-HOSTED runner installed on the production/staging
# VPS. Because the runner executes ON the server, no inbound SSH is required
# (no port 2222, no firewall dependency). The deploy commands run locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main -> Production
    runs-on: [self-hosted, hostinger]
    environment:
      name: production
      url: https://crmcargoconvoy.co

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_BRANCH: main
      PHP_BIN: ${{ vars.PHP_BIN }}
      COMPOSER_BIN: ${{ vars.COMPOSER_BIN }}

    steps:
      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          echo "==> Validating production deploy configuration"
          echo "DEPLOY_PATH=${DEPLOY_PATH:-<unset>}"
          echo "DEPLOY_BRANCH=${DEPLOY_BRANCH:-<unset>}"

          if [[ -z "${DEPLOY_PATH}" ]]; then
            echo "::error::Missing DEPLOY_PATH. Configure it in the production environment variables."
            exit 1
          fi
          if [[ ! -d "${DEPLOY_PATH}" ]]; then
            echo "::error::DEPLOY_PATH '${DEPLOY_PATH}' does not exist on the runner host."
            exit 1
          fi

      - name: Deploy locally
        run: |
          set -euo pipefail

          PHP_BIN="${PHP_BIN:-php}"
          COMPOSER_BIN="${COMPOSER_BIN:-composer}"

          echo "==> Deploying $DEPLOY_BRANCH to $DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          echo "==> Fetching latest code"
          git fetch --all --prune
          git reset --hard "origin/$DEPLOY_BRANCH"

          echo "==> Ensuring web-root files are readable by nginx"
          chmod -R a+rX public

          echo "==> Installing PHP dependencies (production)"
          $COMPOSER_BIN install --no-interaction --prefer-dist --optimize-autoloader --no-dev

          echo "==> Enabling maintenance mode"
          $PHP_BIN artisan down --retry=15 || true
          trap '$PHP_BIN artisan up || true' EXIT

          echo "==> Running database migrations"
          $PHP_BIN artisan migrate --force

          echo "==> Rebuilding caches (route:cache skipped — see note)"
          $PHP_BIN artisan optimize:clear
          $PHP_BIN artisan config:cache
          $PHP_BIN artisan event:cache
          $PHP_BIN artisan view:cache
          $PHP_BIN artisan storage:link || true

          echo "==> Restarting queue workers (Supervisor picks up new code)"
          $PHP_BIN artisan queue:restart

          echo "==> Disabling maintenance mode"
          $PHP_BIN artisan up
          trap - EXIT

          echo "==> Production deploy complete"
