name: Deploy

on:
  push:
    branches:
      - main
      - devN   # literal branch name for staging

jobs:
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

  deploy-production:
    needs: determine-env
    if: needs.determine-env.outputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production   # maps to GitHub "Environments" -> production secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}
            git fetch origin main
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader

            npm ci
            npm run build

            php artisan down || true
            php artisan migrate --force
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up

            sudo systemctl reload php8.3-fpm || sudo systemctl reload php-fpm

  deploy-staging:
    needs: determine-env
    if: needs.determine-env.outputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging      # maps to GitHub "Environments" -> staging secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.STAGING_PORT }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_PATH }}
            git fetch origin devN
            git reset --hard origin/devN

            composer install --optimize-autoloader

            npm ci
            npm run build

            php artisan down || true
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
            php artisan up

            sudo systemctl reload php8.3-fpm || sudo systemctl reload php-fpm
